<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꽃밥이야기 업무일지</title>
<meta name="theme-color" content="#faf7f0">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꽃밥이야기">
<style>:root{--bg:#faf7f0;--card:#fff;--ink:#2b2620;--sub:#7a7166;--line:#e6dfd2;--acc:#e0a100;--acc2:#fff4cf;--accink:#5a4200;--ok:#2f7d4f;--bad:#c0392b;--blue:#2c5d9b;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}
#app{max-width:1200px;margin:0 auto;padding:0 12px 96px}
header.top{position:sticky;top:0;z-index:30;background:var(--bg);padding:10px 0 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;justify-content:space-between}
.brand h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px}
.brand h1 small{font-weight:500;color:var(--sub);font-size:12px;margin-left:6px}
.who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:transparent;padding:9px 13px;border-radius:10px 10px 0 0;white-space:nowrap;color:var(--sub);font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc);background:var(--card)}
.subtabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.subtabs button,.seg button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:999px;font-weight:600;color:var(--sub)}
.subtabs button.on,.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;gap:4px}
.seg button{padding:6px 11px;font-size:13px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.bar .sp{flex:1}
.datenav{display:flex;align-items:center;gap:4px}
.datenav b{min-width:128px;text-align:center;font-size:15px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-weight:600}
.btn{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:9px 15px;font-weight:700}
.btn.acc{background:var(--acc);color:#2b2000}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:14px;color:var(--accink);display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.card h3 .hint{font-weight:400;color:var(--sub);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea,.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;outline:none}
.f input:focus,.f textarea:focus,.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc2)}
.f input.num,.in.num{text-align:right;font-variant-numeric:tabular-nums}
.f .ro,.ro{background:#f4f0e6;border:1px dashed var(--line);border-radius:9px;padding:9px 10px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;min-height:40px}
.f .val{padding:6px 0;font-weight:600;white-space:pre-wrap;word-break:break-word;min-height:24px}
.f .val.n{text-align:right;font-variant-numeric:tabular-nums}
.f .val.empty{color:#bbb;font-weight:400}
textarea.long{min-height:220px;resize:vertical;line-height:1.6}
textarea.mid{min-height:90px;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.savest{font-size:12px;color:var(--sub)}
.savest.ok{color:var(--ok)}.savest.err{color:var(--bad)}
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#2b2620;color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;justify-content:center}
.editbar .msg{font-size:13px;opacity:.9;flex:1;max-width:700px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;box-shadow:0 6px 18px rgba(0,0,0,.25);border-radius:999px;padding:14px 20px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{background:var(--acc2);color:var(--accink);border-radius:999px;padding:5px 10px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;border:0}
.chip .x{opacity:.6;font-weight:800}
.chip small{font-weight:500;opacity:.85}
.sugwrap{position:relative;flex:1;min-width:120px}
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:220px;overflow:auto}
.sug div{padding:10px 12px;border-bottom:1px solid #f3eee2}
.sug div:hover,.sug div.on{background:var(--acc2)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:78vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid #f0eadc;padding:6px 8px;vertical-align:top}
table.t thead th{position:sticky;top:0;background:#f4efe3;z-index:3;white-space:nowrap;font-weight:700}
table.t th.st,table.t td.st{position:sticky;left:0;background:#fbf8f1;z-index:2;text-align:left;font-weight:600;min-width:96px;max-width:150px}
table.t thead th.st{z-index:4}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t td.txt{min-width:150px;max-width:260px;white-space:pre-wrap;word-break:break-word}
table.t td.clip div{max-height:96px;overflow:hidden}
table.t tr.tot td,table.t td.tot,table.t th.tot{background:#fff8e1;font-weight:700}
table.t td.today,table.t th.today{background:#fff4cf}
table.t .wk0{color:var(--bad)}.wk6{color:var(--blue)}
table.t td input{width:64px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;text-align:right}
table.t td input.w{width:130px;text-align:left}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#fffbea}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:700}
.item .nm small{display:block;color:var(--sub);font-weight:400}
.item .stk{font-size:20px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.item .stk small{display:block;font-size:11px;color:var(--sub);font-weight:500}
.item .stk.neg{color:var(--bad)}
.item .ins{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px}
.item .ins label{font-size:11px;color:var(--sub);display:block}
.item .ins input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right}
.modal{position:fixed;inset:0;background:rgba(30,25,15,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:640px){.modal{align-items:center}.modal .box{border-radius:18px}}
.modal h2{margin:0 0 12px;font-size:17px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2b2620;color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:14px;max-width:90vw}
.login{max-width:360px;margin:12vh auto 0;padding:24px}
.login h1{font-size:24px;margin:0 0 4px}
.login p{color:var(--sub);margin:0 0 18px}
.login .f{margin-bottom:12px}
.login .btn{width:100%;padding:12px}
.note{background:var(--acc2);color:var(--accink);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.note.bad{background:#fdecea;color:#7b241c}
.muted{color:var(--sub);font-size:13px}
.org{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.org .col{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.org .col h4{margin:0 0 8px;font-size:14px}
.org .p{display:flex;justify-content:space-between;gap:6px;align-items:center;padding:8px;border-radius:8px;border:1px solid #f0eadc;margin-bottom:6px;background:#fffdf7;width:100%;text-align:left}
.org .p.off{opacity:.45}
.tag{font-size:11px;border-radius:6px;padding:2px 6px;background:#eee;color:#555;white-space:nowrap}
.tag.a{background:#2b2620;color:#fff}.tag.e{background:#dbe7f6;color:#1d467a}.tag.r{background:#e2f2e7;color:#1e5c38}.tag.h{background:#fdebd3;color:#8a4b00}.tag.k{background:#f3e3f3;color:#6b2c6b}
.hist{border-bottom:1px solid var(--line);padding:10px 0}
.hist .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}
.hist .ch{display:grid;grid-template-columns:1fr;gap:4px;margin:6px 0 0;padding:8px;background:#faf7f0;border-radius:8px;font-size:13px}
.hist .ch .k{font-weight:700}
.hist .ch .bf{color:var(--bad);white-space:pre-wrap;word-break:break-word}
.hist .ch .af{color:var(--ok);white-space:pre-wrap;word-break:break-word}
.sw{display:inline-flex;align-items:center;gap:8px}
.sw input{width:42px;height:24px;appearance:none;-webkit-appearance:none;background:#d6cfbf;border-radius:999px;position:relative;transition:.15s;margin:0}
.sw input:checked{background:var(--ok)}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked::after{left:21px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi span{font-size:12px;color:var(--sub);display:block}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk input{width:24px;height:24px;accent-color:var(--ok)}
.demo{background:#2c5d9b;color:#fff;text-align:center;font-size:12px;padding:5px}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.brand h1 small{display:none}}
@media print{header.top,.fab,.editbar,.bar{display:none}}

.brandmark{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 20px}.brandmark h1{font-size:26px;margin:0;letter-spacing:-.5px}.brandmark img{display:block}

.pairs{display:grid;grid-template-columns:minmax(64px,auto) 1fr 1fr;gap:8px 10px;align-items:center}
.pairs .ph{font-size:12px;color:var(--sub);text-align:right;padding-right:10px}
.pairs .pl{font-weight:700}
.pairs input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;text-align:right;background:#fff}
.pairs .pv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;padding:6px 10px}
.pairs .ro{min-height:0}


.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.items .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffdf8;grid-template-columns:1fr auto;align-content:start}
.items .item:last-child{border-bottom:1px solid var(--line)}

.lt{display:flex;gap:8px;align-items:flex-start;width:100%;min-width:180px;text-align:left;border:1px dashed var(--acc);background:#fffdf5;border-radius:8px;padding:7px 9px;color:var(--ink);font-size:13px;line-height:1.5}
.lt span{flex:1;white-space:pre-wrap;word-break:break-word}.lt i{color:var(--sub);font-style:normal}.lt b{color:var(--acc);font-weight:700}
.item .ins .v{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;background:#fff;min-height:36px;font-variant-numeric:tabular-nums;font-weight:600}
.item .ins .v.z{color:#c9c1b3;font-weight:400}

.more{font-size:11px;color:var(--blue);margin-top:3px;font-weight:600}
.pairs{max-width:440px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fffdf8;gap:6px 10px}
.pairs .ph{text-align:center;padding:0;font-weight:700;color:var(--accink)}
.pairs .pv{border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center;padding:8px}
.pairs input,.pairs .ro{text-align:center}
table.lq td input{width:56px}
table.lq td.cat{background:#f4efe3;font-weight:700;vertical-align:middle;text-align:center;min-width:64px;max-width:90px}
table.lq td.nm2{font-weight:600;min-width:110px}
table.lq td.z{color:#c9c1b3}

.tw.fit{display:inline-block;max-width:100%;vertical-align:top}.tw.fit table{width:auto}table.lq th,table.lq td{padding:7px 12px}

/* 표 안에 따로 스크롤을 두지 않는다: 화면 전체가 스크롤되고 표 머리글만 위쪽 메뉴 아래에 고정 */
.tw{overflow:visible!important;max-height:none!important}
table.t thead th{top:var(--hdr2,0px)}
.tw.xs{overflow-x:auto!important}
.tw.xs table.t thead th{position:static;top:auto!important}
.tw.xs table.t thead th.st,.tw.xs table.t td.st{position:sticky;left:0}
.tw.fit{display:block;width:fit-content;max-width:100%;margin-inline:auto}
.modal{overscroll-behavior:contain;touch-action:none}.modal .box{overscroll-behavior:contain;touch-action:pan-y}
/* 위쪽 메뉴 가운데 정렬 */
.brand{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand h1{grid-column:2;text-align:center}.brand .who{grid-column:3;justify-self:end}
.tabs::before,.tabs::after{content:"";flex:1}
.subtabs{justify-content:center}
.bar{justify-content:center}.bar .sp{display:none}
#stBody>.muted,#logBody>.muted{text-align:center}

.fitwrap{width:fit-content;max-width:100%;margin-inline:auto}

.bar.dbar{position:sticky;top:var(--hdr,0px);z-index:25;background:var(--bg);margin:0;padding:8px 0;border-bottom:1px solid var(--line)}
@media(max-width:700px){header.top{position:static}body.typing .editbar{display:none}}
tr.todayrow td{background:#fff4cf!important;box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
tr.todayrow td:first-child{box-shadow:inset 3px 0 0 var(--acc),inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
.modal .box{position:relative}
.mx{position:sticky;top:0;float:right;margin:-6px -6px 0 8px;z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}

td.golink{cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.vgrid>.f{border:1px solid var(--line);border-radius:10px;padding:8px 12px 6px;background:#fdfbf5;margin:0}
.vgrid>.f label{margin-bottom:0}
.vgrid>.f .val{padding:2px 0 0;font-size:16px}
table.mt td.n,table.mt thead tr:nth-child(2) th{width:58px;min-width:58px;max-width:58px;box-sizing:border-box}
table.mt td.n input,table.t td.n input.cell{width:100%;min-width:0;box-sizing:border-box;border:0;background:#fffdf3;text-align:right;padding:6px 3px;font:inherit;border-radius:0}
table.t td.n input.cell:focus,table.mt td.n input:focus{outline:2px solid var(--acc);background:#fff}
table.t td.ed{padding:0}

.daywrap{max-width:500px;margin-inline:auto}
.daywrap .grid{grid-template-columns:1fr 1fr}
.daywrap .pairs{max-width:none}
.vgrid>.f .ro{background:none;border:0;padding:2px 0 0;min-height:24px;font-size:16px;font-weight:600}

table.t th.tcol,table.t td.tcol{border-left:2.5px solid var(--acc)!important;border-right:2.5px solid var(--acc)!important;background:#fff4cf}
table.t thead th.tcol{border-top:2.5px solid var(--acc)!important;color:var(--accink)}
table.t tbody tr:last-child td.tcol,table.t tbody tr:nth-last-child(2) td.tcol{border-bottom:2.5px solid var(--acc)!important}
table.t th.cnt,table.t td.cnt{background:#eef6ee}
table.t td.cnt.tcol,table.t th.cnt.tcol{background:#fff4cf}
table.t th small{font-weight:500;font-size:10.5px}
tr.todayrow td.ed input{background:#fff4cf}

.fhead{position:sticky;top:var(--hdr2,0px);z-index:20;overflow:hidden;border-radius:var(--r) var(--r) 0 0;border:1px solid var(--line);border-bottom:0;box-sizing:border-box;pointer-events:auto}
.fhead table.t thead th{position:static!important;top:auto!important}
.fhead table.t thead th.st{position:sticky!important;left:0;z-index:2}
.tw.fit{width:fit-content;max-width:100%;margin-inline:auto}
.tw.fit table.t{width:auto}

table.t.nw th.st,table.t.nw td.st{white-space:nowrap;max-width:none}
table.t td.st br+*{}
tr.todayrow:has(input.cell) td{box-shadow:inset 0 3px 0 var(--acc),inset 0 -3px 0 var(--acc)}
table.t td.ed:focus-within{outline:3px solid var(--acc);outline-offset:-3px;position:relative;z-index:1}
tr.todayrow td.ed input.cell{background:#fff4cf!important}
tr.todayrow:has(input.cell) td{border-top:3px solid var(--acc)!important;border-bottom:3px solid var(--acc)!important}

.mdone{flex-basis:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2b2620;color:#fff;border-radius:10px;padding:6px 8px 6px 14px;margin-top:4px}
.mdone .msg{font-size:13px;opacity:.9}
.mdone .btn{padding:8px 22px;font-size:15px}
.tw.fit table.t th.st,.tw.fit table.t td.st{min-width:0;white-space:nowrap}
.bar.dbar:has(.mdone) .seg{display:none}

table.t.cnw th,table.t.cnw td{white-space:nowrap}
table.t.cnw td.txt{white-space:pre-wrap;min-width:240px;max-width:360px}

table.t td.tcol input.cell,table.t td.tcol textarea.cell{background:#fff4cf!important}
table.t textarea.cell{width:100%;min-width:110px;box-sizing:border-box;border:0;background:#fffdf3;padding:6px;font:inherit;resize:none;display:block;overflow:hidden;line-height:1.4}
table.t.wk td.n input.cell{min-width:80px}
table.t.mt.wk td.n,table.t.mt.wk thead tr:nth-child(2) th{width:auto;min-width:88px;max-width:none}
@media(max-width:700px){.daywrap .kpis{grid-template-columns:1fr}}

/* 상단 메뉴: 1단은 글자 메뉴에 선택된 것만 옅은 알약, 2단은 흰 캡슐 안에 밑줄 표시 */
.tabs{gap:6px;margin-top:6px;padding-bottom:8px}
.tabs button{border-radius:10px;border-bottom:0;padding:8px 16px;font-size:15px;color:#4a443b;font-weight:600}
.tabs button.on{background:#f3e3b8;color:var(--accink,#6b4a00);border:0}
header.top{border-bottom:0}
#subTabs,.subtabs.cap{width:fit-content;max-width:100%;margin:2px auto 12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(60,40,0,.07);padding:0 12px;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#subTabs::-webkit-scrollbar,.subtabs.cap::-webkit-scrollbar{display:none}
#subTabs:empty{display:none}
#subTabs button,.subtabs.cap button{border:0;background:transparent;border-radius:0;padding:12px 18px 10px;border-bottom:3px solid transparent;color:#4a443b;font-weight:600;white-space:nowrap;font-size:15px}
#subTabs button.on,.subtabs.cap button.on{background:transparent;color:var(--accink,#6b4a00);border-bottom-color:var(--acc);font-weight:800}
@media(max-width:520px){#subTabs button,.subtabs.cap button{padding:10px 12px 8px;font-size:14px}.tabs button{padding:7px 12px;font-size:14px}}

<script>'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v==null||v==='')return 0;const n=Number(String(v).replace(/[,\s]/g,''));return isNaN(n)?0:n;};
const numOrNull=v=>{if(v==null||String(v).trim()==='')return null;const n=Number(String(v).replace(/[,\s]/g,''));return isNaN(n)?null:n;};
const won=n=>(n==null||n==='')?'':(Math.round(Number(n)*100)/100).toLocaleString('ko-KR');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const ymOf=s=>s.slice(0,7);
const addMonth=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const DOW=['일','월','화','수','목','금','토'];
const dowOf=s=>parseYmd(s).getDay();
const today=()=>ymd(new Date());
const fmtDate=s=>{const d=parseYmd(s);return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`;};
const fmtTs=t=>{if(!t)return'';const d=t.toDate?t.toDate():t.seconds!=null?new Date(t.seconds*1000):new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const same=(a,b)=>JSON.stringify(a??null)===JSON.stringify(b??null);
const getPath=(o,k)=>{let c=o;for(const p of k.split('/')){if(c==null)return undefined;c=c[p];}return c;};
const setPath=(o,k,v)=>{const ps=k.split('/');let c=o;for(let i=0;i<ps.length-1;i++){if(c[ps[i]]==null||typeof c[ps[i]]!=='object'||Array.isArray(c[ps[i]]))c[ps[i]]={};c=c[ps[i]];}c[ps[ps.length-1]]=v;};
const deepMerge=(t,s)=>{for(const k in s){const v=s[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&!(v instanceof Date)){if(!t[k]||typeof t[k]!=='object'||Array.isArray(t[k]))t[k]={};deepMerge(t[k],v);}else t[k]=v;}return t;};
const clone=o=>JSON.parse(JSON.stringify(o??null));
function toast(m,ms=2200){document.querySelectorAll('.toast').forEach(x=>x.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
// 창: 닫기 버튼으로만 닫히고, 떠 있는 동안 뒤 화면은 스크롤되지 않는다
let _lockY=0;function lockScroll(on){const b=document.body;if(on){if(b.dataset.lock)return;_lockY=scrollY;b.dataset.lock='1';b.style.position='fixed';b.style.top=(-_lockY)+'px';b.style.left='0';b.style.right='0';}
  else{if(document.querySelector('.modal'))return;if(!b.dataset.lock)return;delete b.dataset.lock;b.style.position='';b.style.top='';b.style.left='';b.style.right='';scrollTo(0,_lockY);}}
function modal(html,onMount){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box"><button type="button" class="mx" aria-label="닫기">✕</button>${html}</div>`;lockScroll(true);document.body.appendChild(m);const close=()=>{m.remove();lockScroll(false);};m.querySelector('.mx').onclick=()=>{const c=m.querySelector('#cN,#pdX');if(c)c.click();else close();};$$('[data-close]',m).forEach(b=>b.onclick=close);if(onMount)onMount(m,close);return close;}
function confirmBox(msg,okLabel='확인'){return new Promise(res=>{modal(`<h2>확인</h2><div style="white-space:pre-wrap">${esc(msg)}</div><div class="row"><button class="btn ghost" id="cN">취소</button><button class="btn" id="cY">${esc(okLabel)}</button></div>`,(m,close)=>{$('#cN',m).onclick=()=>{close();res(false);};$('#cY',m).onclick=()=>{close();res(true);};});});}
// 1030 2000 -> 10:30~20:00
function parseTimeRange(raw){
  if(!raw)return'';let s=String(raw).trim();if(!s)return'';
  if(/휴무|없음/.test(s))return s;
  let toks=s.replace(/[:：]/g,'').split(/[\s~\-–—,]+/).filter(Boolean);
  if(toks.length===1&&/^\d{6,8}$/.test(toks[0])){const t=toks[0];const h=Math.floor(t.length/2);toks=[t.slice(0,h),t.slice(h)];}
  const one=t=>{if(!/^\d{1,4}$/.test(t))return null;let h,m;if(t.length<=2){h=+t;m=0;}else if(t.length===3){h=+t[0];m=+t.slice(1);}else{h=+t.slice(0,2);m=+t.slice(2);}if(h>24||m>59)return null;return pad(h)+':'+pad(m);};
  const r=toks.map(one);if(r.some(x=>x==null)||r.length>2)return s;
  return r.join('~');
}
const hoursOf=t=>{const m=/^(\d\d):(\d\d)~(\d\d):(\d\d)$/.exec(t||'');if(!m)return 0;const h=(+m[3]*60+ +m[4]-(+m[1]*60+ +m[2]))/60;return h>0?h:0;};

const STORES={
  pida:{name:'꽃밥에피다',sub:'인사동식당',weekStart:1,tabs:{log:true,stock:true,cash:true}},
  bojagi:{name:'보자기꽃밥',sub:'북촌식당',weekStart:0,tabs:{log:true,stock:true,chae:true,cash:false}},
  market:{name:'꽃밥마켓',sub:'북촌마켓',weekStart:1,tabs:{log:true,stock:false,cash:false}}
};
const STORE_IDS=Object.keys(STORES);
const ROLE_L={admin:'관리자',exec:'임원',staff:'직원'};
const EMP_L={regular:'정규직',hourly:'시급직',helper:'주방보조',shared:'사업장 공용 (노트북)'};
const TAB_L={log:'업무일지',stock:'재고조사',chae:'채개장재고표',cash:'현금출납장'};

// ===== 데이터 계층: Firebase(실사용) / 메모리(데모) 공통 인터페이스 =====
const EMAIL_DOMAIN='@flowerrice.example.com';
const ADMIN_ID='yeriberry', INIT_PW='123456';
const nameKey=n=>[...new TextEncoder().encode(String(n).normalize('NFC').trim())].map(b=>b.toString(16).padStart(2,'0')).join('');
const DB={mode:'demo',cache:{},me:null,_sess:{},_authCb:null,actor:null,
  // 사업장 공용(노트북) 계정은 오늘의 작성자를 골라서 기록한다
  isShared(){return !!(this.me&&this.me.role==='staff'&&this.me.empType==='shared');},
  who(){return this.isShared()?(this.actor||this.me.name):(this.me?this.me.name:'');},
  whoFull(){return this.isShared()&&this.actor?`${this.actor} (${this.me.name})`:(this.me?this.me.name:'');},
  dataPath:(sid,docId)=>`stores/${sid}/data/${docId}`,
  sess(sid,docId){const k=sid+'/'+docId;let s=this._sess[k];if(!s||Date.now()-s.t>30*60000){s=this._sess[k]={hid:rid()+rid(),seen:new Set(),fresh:true,t:Date.now()};}s.t=Date.now();return s;},
  endSession(){this._sess={};},
  async init(){
    const c=window.FIREBASE_CONFIG;
    if(c&&c.apiKey&&!/^여기|^YOUR|^$/.test(c.apiKey)){this.mode='fb';await FB.init(c);}else{this.mode='demo';MEM.init();}
  },
  get impl(){return this.mode==='fb'?FB:MEM;},
  onAuth(cb){this._authCb=cb;this.impl.onAuth(cb);},
  login(n,p){return this.impl.login(n.trim(),p);},
  logout(){this.endSession();return this.impl.logout();},
  changePw(o,n){return this.impl.changePw(o,n);},
  watch(path,cb){return this.impl.watch(path,d=>{this.cache[path]=d;cb(clone(d));});},
  watchRange(coll,a,b,cb){return this.impl.watchRange(coll,a,b,m=>{for(const id in m)this.cache[coll+'/'+id]=m[id];cb(clone(m));});},
  watchColl(coll,cb){return this.impl.watchColl(coll,cb);},
  async get(path){const d=await this.impl.get(path);this.cache[path]=d;return d;},
  async getRange(coll,a,b){const m=await this.impl.getRange(coll,a,b);for(const id in m)this.cache[coll+'/'+id]=m[id];return m;},
  // changes: {'a/b/c':value}. 변경 전 값은 자동으로 history에 보존됨
  async commit(sid,docId,changes,note){
    const path=this.dataPath(sid,docId);
    if(!(path in this.cache))await this.get(path);
    const cur=this.cache[path]||{};const s=this.sess(sid,docId);
    const before={},after={},nested={};
    for(const k in changes){const old=getPath(cur,k);if(same(old,changes[k]))continue;
      if(!s.seen.has(k)){before[k]=old===undefined?null:clone(old);s.seen.add(k);}
      after[k]=changes[k];setPath(nested,k,changes[k]);}
    if(!Object.keys(after).length)return false;
    const h={sid,docId,docKey:sid+'/'+docId,by:this.me.uid,byName:DB.whoFull(),after};
    if(Object.keys(before).length)h.before=before;
    if(note)h.note=note;
    const fresh=s.fresh;s.fresh=false;
    // 낙관적 캐시 반영
    this.cache[path]=deepMerge(clone(cur)||{},clone(nested));
    await this.impl.commit(path,nested,s.hid,h,fresh);
    return true;
  },
  setDoc(path,data,note){return this.impl.setDoc(path,data,note);},
  // 품목 정보(이름, 규격, 단가 등) 수정: 설정 문서를 고치고 변경이력을 함께 남긴다
  setCfg(sid,kind,patch,before,after){return this.impl.setCfg(sid,kind,patch,{sid,docId:'itemcfg_'+kind,docKey:sid+'/itemcfg_'+kind,by:this.me.uid,byName:this.whoFull(),before,after});},
  history(opt){return this.impl.history(opt||{});},
  createUser(p){return this.impl.createUser(p);},
  updateUser(uid,patch){return this.impl.updateUser(uid,patch);},
  resetPw(uid){return this.impl.resetPw(uid);},
  exportAll(){return this.impl.exportAll();}
};

// ---------- 메모리(데모) ----------
const MEM={docs:{},ls:[],authCb:null,
  init(){
    try{const s=localStorage.getItem('fr_demo_v1');if(s)this.docs=JSON.parse(s);}catch(e){}
    if(!this.docs['users/admin']){
      const U=(id,name,role,storeId,empType)=>{this.docs['users/'+id]={name,role,storeId:storeId||null,empType:empType||null,active:true,mustChangePw:false,_pw:INIT_PW};};
      U('admin',ADMIN_ID,'admin');this.docs['users/admin'].mustChangePw=true;
      U('e1','김임원','exec');
      U('p1','이하늘','staff','pida','regular');U('p2','이바다','staff','pida','regular');U('p3','이나무','staff','pida','regular');U('p4','박구름','staff','pida','regular');U('p5','정시급','staff','pida','hourly');
      U('b1','최보리','staff','bojagi','regular');U('b2','한수수','staff','bojagi','regular');
      U('m1','오마켓','staff','market','regular');U('m2','홍마켓','staff','market','regular');
      this.docs['stores/pida']={helpers:['김파출','윤파출']};this.docs['stores/bojagi']={helpers:['파출']};
    }
  },
  save(){try{localStorage.setItem('fr_demo_v1',JSON.stringify(this.docs));}catch(e){}},
  fire(){this.save();this.ls.forEach(f=>{try{f();}catch(e){console.error(e);}});},
  sub(f){this.ls.push(f);f();return()=>{this.ls=this.ls.filter(x=>x!==f);};},
  onAuth(cb){this.authCb=cb;cb(null);},
  async login(n,p){const e=Object.entries(this.docs).find(([k,v])=>k.startsWith('users/')&&v.name===n);
    if(!e||e[1]._pw!==p)throw new Error('아이디 또는 비밀번호가 맞지 않습니다.');if(!e[1].active)throw new Error('사용 중지된 계정입니다.');
    DB.me={uid:e[0].slice(6),...e[1]};this.authCb(DB.me);},
  async logout(){DB.me=null;this.authCb(null);},
  async changePw(o,n){const u=this.docs['users/'+DB.me.uid];if(u._pw!==o)throw new Error('현재 비밀번호가 맞지 않습니다.');u._pw=n;u.mustChangePw=false;DB.me.mustChangePw=false;this.fire();},
  watch(path,cb){return this.sub(()=>cb(clone(this.docs[path])||null));},
  range(coll,a,b){const m={};for(const k in this.docs){if(!k.startsWith(coll+'/'))continue;const id=k.slice(coll.length+1);if(id.includes('/'))continue;if(id>=a&&id<=b)m[id]=clone(this.docs[k]);}return m;},
  watchRange(coll,a,b,cb){return this.sub(()=>cb(this.range(coll,a,b)));},
  watchColl(coll,cb){return this.sub(()=>cb(this.range(coll,'','￿')));},
  async get(path){return clone(this.docs[path])||null;},
  async getRange(coll,a,b){return this.range(coll,a,b);},
  async commit(path,nested,hid,h,fresh){
    const d=this.docs[path]||(this.docs[path]={});deepMerge(d,clone(nested));Object.assign(d,{_by:h.by,_byName:h.byName,_at:Date.now(),_hid:hid});
    const hp='history/'+hid;const hd=this.docs[hp]||(this.docs[hp]={at:Date.now(),before:{},after:{}});
    const{before,after,...rest}=h;Object.assign(hd,rest,{last:Date.now()});Object.assign(hd.before,clone(before||{}));Object.assign(hd.after,clone(after));
    this.fire();},
  async setDoc(path,data,note){const d=this.docs[path]||(this.docs[path]={});deepMerge(d,clone(data));
    if(note)this.docs['history/'+rid()]={sid:'_admin',docId:path,docKey:'_admin/'+path,by:DB.me.uid,byName:DB.me.name,at:Date.now(),last:Date.now(),note,before:{},after:{}};this.fire();},
  async setCfg(sid,kind,patch,h){const p=`stores/${sid}/config/${kind}`;const d=this.docs[p]||(this.docs[p]=clone((typeof DEMO_STOCK!=='undefined'&&DEMO_STOCK[kind])||{}));deepMerge(d,clone(patch));this.docs['history/'+rid()]={...h,at:Date.now(),last:Date.now()};this.fire();},
  async history(o){let a=Object.entries(this.range('history','','￿')).map(([id,v])=>({id,...v}));if(o.docKey)a=a.filter(x=>x.docKey===o.docKey);a.sort((x,y)=>y.last-x.last);return a.slice(0,o.limit||200);},
  async createUser(p){if(Object.entries(this.docs).some(([k,v])=>k.startsWith('users/')&&v.name===p.name))throw new Error('이미 있는 아이디입니다.');
    this.docs['users/'+rid()]={...p,active:true,mustChangePw:true,_pw:INIT_PW};this.fire();},
  async updateUser(uid,patch){Object.assign(this.docs['users/'+uid],patch);if(DB.me&&DB.me.uid===uid)Object.assign(DB.me,patch);this.fire();},
  async resetPw(uid){Object.assign(this.docs['users/'+uid],{_pw:INIT_PW,mustChangePw:true});this.fire();},
  async exportAll(){return clone(this.docs);}
};

// ---------- Firebase ----------
const FB={app:null,auth:null,fs:null,cfg:null,
  loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('스크립트 로드 실패: '+src));document.head.appendChild(s);});},
  async init(cfg){this.cfg=cfg;const v='10.12.5',b=`https://www.gstatic.com/firebasejs/${v}/firebase-`;
    await this.loadScript(b+'app-compat.js');await Promise.all([this.loadScript(b+'auth-compat.js'),this.loadScript(b+'firestore-compat.js')]);
    this.app=firebase.initializeApp(cfg);this.auth=firebase.auth();this.fs=firebase.firestore();
    try{await this.fs.enablePersistence({synchronizeTabs:true});}catch(e){console.warn('offline cache off',e.code);}
  },
  ts(){return firebase.firestore.FieldValue.serverTimestamp();},
  data(s){return s.exists?s.data({serverTimestamps:'estimate'}):null;},
  onAuth(cb){let un=null;this.auth.onAuthStateChanged(u=>{if(un){un();un=null;}
    if(!u){DB.me=null;cb(null);return;}
    un=this.fs.doc('users/'+u.uid).onSnapshot(s=>{const d=this.data(s);
      if(!d){if(this._boot)return;DB.me=null;cb(null,'계정 정보가 없습니다. 관리자에게 문의하세요.');this.auth.signOut();return;}
      if(d.active===false){DB.me=null;cb(null,'사용 중지된 계정입니다.');this.auth.signOut();return;}
      const first=!DB.me||DB.me.uid!==u.uid||DB.me.role!==d.role||DB.me.storeId!==d.storeId||DB.me.mustChangePw!==d.mustChangePw;
      DB.me={uid:u.uid,...d};if(first)cb(DB.me);},e=>{console.error(e);cb(null,'계정 정보를 읽을 수 없습니다.');});});},
  email(key,ver){return 'u'+key+'.'+ver+EMAIL_DOMAIN;},
  async login(n,p){const key=nameKey(n);let idx=null;
    try{idx=this.data(await this.fs.doc('loginIndex/'+key).get());}catch(e){console.warn(e);}
    if(!idx){
      if(n===ADMIN_ID){const b=await this.fs.doc('meta/bootstrap').get().catch(()=>null);
        if(b&&!b.exists){if(p!==INIT_PW)throw new Error('처음 로그인은 초기 비밀번호로 해 주세요.');return this.bootstrap(key);}}
      throw new Error('아이디 또는 비밀번호가 맞지 않습니다.');}
    try{await this.auth.signInWithEmailAndPassword(idx.email,p);}catch(e){throw new Error(/network/.test(e.code||'')?'네트워크 연결을 확인해 주세요.':'아이디 또는 비밀번호가 맞지 않습니다.');}
  },
  async bootstrap(key){this._boot=true;const email=this.email(key,1);
    try{const c=await this.auth.createUserWithEmailAndPassword(email,INIT_PW);const uid=c.user.uid;const b=this.fs.batch();
      b.set(this.fs.doc('users/'+uid),{name:ADMIN_ID,role:'admin',storeId:null,empType:null,active:true,mustChangePw:true,createdAt:this.ts()});
      b.set(this.fs.doc('meta/bootstrap'),{uid,at:this.ts()});
      b.set(this.fs.doc('loginIndex/'+key),{email,ver:1});await b.commit();
    }finally{this._boot=false;}
    const s=await this.fs.doc('users/'+this.auth.currentUser.uid).get();DB.me={uid:this.auth.currentUser.uid,...this.data(s)};DB._authCb(DB.me);},
  logout(){return this.auth.signOut();},
  async changePw(o,n){const u=this.auth.currentUser;const cred=firebase.auth.EmailAuthProvider.credential(u.email,o);
    try{await u.reauthenticateWithCredential(cred);}catch(e){throw new Error('현재 비밀번호가 맞지 않습니다.');}
    await u.updatePassword(n);await this.fs.doc('users/'+u.uid).update({mustChangePw:false});},
  err(e){console.error(e);if(e&&e.code==='permission-denied')toast('권한이 없습니다.');},
  watch(path,cb){return this.fs.doc(path).onSnapshot(s=>cb(this.data(s)),e=>this.err(e));},
  q(coll,a,b){const id=firebase.firestore.FieldPath.documentId();return this.fs.collection(coll).where(id,'>=',a).where(id,'<=',b);},
  toMap(qs){const m={};qs.forEach(d=>m[d.id]=d.data({serverTimestamps:'estimate'}));return m;},
  watchRange(coll,a,b,cb){return this.q(coll,a,b).onSnapshot(qs=>cb(this.toMap(qs)),e=>this.err(e));},
  watchColl(coll,cb){return this.fs.collection(coll).onSnapshot(qs=>cb(this.toMap(qs)),e=>this.err(e));},
  async get(path){return this.data(await this.fs.doc(path).get());},
  async getRange(coll,a,b){return this.toMap(await this.q(coll,a,b).get());},
  commit(path,nested,hid,h,fresh){const b=this.fs.batch();
    b.set(this.fs.doc(path),{...nested,_by:h.by,_byName:h.byName,_at:this.ts(),_hid:hid},{merge:true});
    const hd={...h,last:this.ts()};if(fresh)hd.at=this.ts();
    b.set(this.fs.doc('history/'+hid),hd,{merge:true});
    // 오프라인에서도 대기열에 쌓였다가 연결되면 전송됨
    const p=b.commit();p.catch(e=>{this.err(e);toast('저장 실패: '+(e.code||e.message),4000);});
    return Promise.race([p,new Promise(r=>setTimeout(r,1500))]);},
  async setCfg(sid,kind,patch,h){const b=this.fs.batch();b.set(this.fs.doc(`stores/${sid}/config/${kind}`),patch,{merge:true});b.set(this.fs.doc('history/'+rid()+rid()),{...h,at:this.ts(),last:this.ts()});await b.commit();},
  async setDoc(path,data,note){const b=this.fs.batch();b.set(this.fs.doc(path),data,{merge:true});
    if(note){const id=rid()+rid();b.set(this.fs.doc('history/'+id),{sid:'_admin',docId:path,docKey:'_admin/'+path,by:DB.me.uid,byName:DB.me.name,at:this.ts(),last:this.ts(),note,after:{}});}
    await b.commit();},
  async history(o){let q=this.fs.collection('history');
    if(o.docKey)q=q.where('docKey','==',o.docKey);else q=q.orderBy('last','desc').limit(o.limit||200);
    const a=[];(await q.get()).forEach(d=>a.push({id:d.id,...d.data({serverTimestamps:'estimate'})}));
    a.sort((x,y)=>(y.last?.toMillis?.()||0)-(x.last?.toMillis?.()||0));return a;},
  async secAuth(){if(!this.sec){this.sec=firebase.initializeApp(this.cfg,'sec');await this.sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);}return this.sec.auth();},
  async newAccount(name){const key=nameKey(name);if(key.length>60)throw new Error('아이디는 한글 10자 이내로 해 주세요.');
    const idx=this.data(await this.fs.doc('loginIndex/'+key).get());const ver=(idx?.ver||0)+1;const email=this.email(key,ver);
    const sa=await this.secAuth();const c=await sa.createUserWithEmailAndPassword(email,INIT_PW);await sa.signOut();return{uid:c.user.uid,key,email,ver};},
  async createUser(p){const key=nameKey(p.name);const idx=this.data(await this.fs.doc('loginIndex/'+key).get());
    if(idx&&idx.uid){const u=await this.fs.doc('users/'+idx.uid).get();if(u.exists)throw new Error('이미 있는 아이디입니다.');}
    const a=await this.newAccount(p.name);const b=this.fs.batch();
    b.set(this.fs.doc('users/'+a.uid),{...p,active:true,mustChangePw:true,createdAt:this.ts()});
    b.set(this.fs.doc('loginIndex/'+a.key),{email:a.email,ver:a.ver,uid:a.uid});await b.commit();},
  async updateUser(uid,patch){await this.fs.doc('users/'+uid).update(patch);},
  async resetPw(uid){const s=await this.fs.doc('users/'+uid).get();const d=s.data();const a=await this.newAccount(d.name);const b=this.fs.batch();
    b.set(this.fs.doc('users/'+a.uid),{...d,mustChangePw:true,prevUid:uid});b.delete(this.fs.doc('users/'+uid));
    b.set(this.fs.doc('loginIndex/'+a.key),{email:a.email,ver:a.ver,uid:a.uid});await b.commit();},
  async exportAll(){const out={};const dump=async(coll)=>{(await this.fs.collection(coll).get()).forEach(d=>out[coll+'/'+d.id]=d.data());};
    await dump('users');await dump('history');for(const sid of STORE_IDS){const s=await this.fs.doc('stores/'+sid).get();if(s.exists)out['stores/'+sid]=s.data();await dump(`stores/${sid}/data`);await dump(`stores/${sid}/config`);}
    return JSON.parse(JSON.stringify(out,(k,v)=>v&&v.seconds!=null&&v.nanoseconds!=null?new Date(v.seconds*1000).toISOString():v));}
};

function namesFor(sid,src){
  const us=Object.values(USERS).filter(u=>u.active!==false&&u.role==='staff'&&u.storeId===sid&&u.empType!=='shared');
  let a=[];
  if(src==='regular')a=us.filter(u=>u.empType==='regular').map(u=>u.name);
  else if(src==='hourly')a=us.filter(u=>u.empType==='hourly').map(u=>u.name);
  else if(src==='helper')a=[...(storeCfg(sid).helpers||[]),...us.filter(u=>u.empType==='helper').map(u=>u.name)];
  else if(src==='part')a=[...us.filter(u=>u.empType==='hourly').map(u=>u.name),...(storeCfg(sid).helpers||[]),...us.filter(u=>u.empType==='helper').map(u=>u.name)];
  else a=us.map(u=>u.name);
  return [...new Set(a)].sort((x,y)=>x.localeCompare(y,'ko'));
}

const Saver={q:{},timer:null,state:'',
  put(sid,docId,key,val,note){const k=sid+'|'+docId;(this.q[k]=this.q[k]||{sid,docId,ch:{},note}).ch[key]=val;this.set('pending');clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),1200);},
  async flush(now){clearTimeout(this.timer);if(!now)await new Promise(r=>setTimeout(r,0));const q=this.q;this.q={};const ks=Object.keys(q);if(!ks.length)return;
    try{for(const k of ks){const{sid,docId,ch,note}=q[k];
      if(docId.startsWith('daily_')&&DB.me&&!(DB.isShared()&&!DB.actor)){const cur=DB.cache[DB.dataPath(sid,docId)]||{};const w=cur.writers||[];const me=DB.who();if(!w.includes(me)&&!('writers' in ch))ch.writers=[...w,me];}
      await DB.commit(sid,docId,ch,note);}
      this.set('saved');}catch(e){console.error(e);this.set('error');toast('저장 중 오류가 났습니다. 네트워크를 확인해 주세요.',3500);}},
  set(st){this.state=st;const el=$('#saveSt');if(!el)return;const d=new Date();
    el.className='savest '+(st==='saved'?'ok':st==='error'?'err':'');
    el.textContent=st==='pending'?'저장 중…':st==='saved'?`자동 저장됨 ${pad(d.getHours())}:${pad(d.getMinutes())}`:st==='error'?'저장 실패':'';}
};

function pwForm(force){
  const html=`<h2>비밀번호 변경</h2>${force?'<div class="note">처음 로그인하셨습니다. 본인만 아는 비밀번호로 바꿔 주세요.</div>':''}
  <div class="f"><label>현재 비밀번호</label><input id="p0" type="password" ${force?`value="${INIT_PW}"`:''}></div>
  <div class="f" style="margin-top:8px"><label>새 비밀번호 (6자 이상)</label><input id="p1" type="password"></div>
  <div class="f" style="margin-top:8px"><label>새 비밀번호 확인</label><input id="p2" type="password"></div>
  ${force?'<button class="btn" id="pOk" style="width:100%;padding:14px;margin-top:16px;font-size:16px">비밀번호 변경하기</button><div style="text-align:center;margin-top:28px"><button id="pOut" style="border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;padding:6px">로그아웃</button></div>':'<div class="row"><button class="btn ghost" data-close>취소</button><button class="btn" id="pOk">변경</button></div>'}`;
  const bind=(m,close)=>{$('#pOk',m).onclick=async()=>{const o=$('#p0',m).value,a=$('#p1',m).value,b=$('#p2',m).value;
      if(a.length<6)return toast('새 비밀번호는 6자 이상이어야 합니다.');if(a!==b)return toast('새 비밀번호가 서로 다릅니다.');if(a===INIT_PW)return toast('초기 비밀번호와 다른 것으로 정해 주세요.');
      try{await DB.changePw(o,a);toast('비밀번호가 변경되었습니다.');if(close)close();if(force)renderMain();}catch(e){toast(e.message||'변경 실패');}};
    const po=$('#pOut',m);if(po)po.onclick=()=>DB.logout();};
  if(force){clearAll();root().innerHTML=`<div class="login card">${html}</div>`;bind(root());}else modal(html,bind);
}

function renderMain(){clearAll();
  if(DB.me.mustChangePw)return pwForm(true);

// 수량을 g으로 적는데 단가는 1kg, 100g 기준인 품목 (엑셀과 같은 방식으로 적어도 금액이 맞게 자동 환산)
const AUTO_DIV=[[/돼지앞다리살/,'1kg',1000],[/한우 불고기\(설깃\)/,'100g',100]];
function divOf(it){if(num(it.div)>0)return num(it.div);const r=AUTO_DIV.find(([re,sp])=>re.test(it.name||'')&&String(it.spec||'').replace(/\s/g,'').toLowerCase()===sp);return r?r[2]:1;}
// ---- 재고조사(실사) 기록: 날짜별로 여러 번 가능. cnt/DD/품목 = 수량, 말일 조사는 예전처럼 count/품목
function cntLast(doc,id,n){const L=pad(n);if(doc&&doc.count&&doc.count[id]!=null)return{dd:L,val:num(doc.count[id])};const c=doc&&doc.cnt||{};const ds=Object.keys(c).filter(dd=>c[dd]&&c[dd][id]!=null).sort();if(!ds.length)return null;const dd=ds[ds.length-1];return{dd,val:num(c[dd][id])};}
function cntDays(doc,n){const c=doc&&doc.cnt||{};const ds=Object.keys(c).filter(dd=>c[dd]&&Object.values(c[dd]).some(v=>v!=null));if(doc&&doc.count&&Object.values(doc.count).some(v=>v!=null))ds.push(pad(n));return[...new Set(ds)].sort();}
function cntKey(dd,id,n){return dd===pad(n)?`count/${id}`:`cnt/${dd}/${id}`;}
function cntVal(doc,dd,id,n){const v=dd===pad(n)?(doc.count&&doc.count[id]):(doc.cnt&&doc.cnt[dd]&&doc.cnt[dd][id]);return v==null?null:num(v);}
// 월말 재고: 마지막 재고조사 수량 + 그 뒤의 매입 - 사용. 조사 기록이 없으면 장부재고
function invEndCalc(doc,id,carry,ym,netOf,cache){const n=daysIn(ym);const sumsTo=u=>{const k=u||0;if(cache[k])return cache[k];const r={};const d=doc&&doc.d||{};for(const dd in d){if(u&&+dd>u)continue;for(const i in d[dd]){const o=r[i]||(r[i]={});for(const c in d[dd][i])o[c]=(o[c]||0)+num(d[dd][i][c]);}}return cache[k]=r;};
  const book=carry+netOf(sumsTo(0)[id]);const L=cntLast(doc,id,n);if(!L)return{book,count:null,end:book,diff:0,dd:null};const at=carry+netOf(sumsTo(+L.dd)[id]);const r2=x=>Math.round(x*1000)/1000;return{book,count:L.val,end:r2(L.val+(book-at)),diff:r2(L.val-at),dd:L.dd};}
// 품목 정보는 '적용 시작 월'별로 보관한다. v:{'2026-09':{name:..}} 는 9월부터 그 값, 이전 달은 예전 값 그대로
function itemAt(it,ym){const r={...it};const v=it.v||{};Object.keys(v).sort().forEach(k=>{if(k<=ym)Object.assign(r,v[k]);});return r;}

  // 재고조사표: 머리글(상품명, 단가, 이월, 재고, 날짜 숫자)을 읽어 시트마다 다른 칸 배치를 자동으로 맞춘다
  inv(sheets,ym,cfg){const patch={},ch={},docs={},last=pad(daysIn(ym));let recs=0,memo=null;const y=ym.slice(0,4);

  L(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;},
  N(l){let n=0;for(const ch of l)n=n*26+ch.charCodeAt(0)-64;return n;},
  ref(r){const m=/^([A-Z]+)(\d+)$/.exec(r);return[m[1],+m[2]];},
  x(s){return String(s).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');},
  serial(d){const[y,m,dd]=d.split('-').map(Number);return Math.round((Date.UTC(y,m-1,dd)-Date.UTC(1899,11,30))/86400000);},
  model(t){return clone(t);},
  row(m,r){return m.rows[r]||(m.rows[r]={a:{},c:{}});},
  st(m,ref){const[L,r]=this.ref(ref);const c=m.rows[r]&&m.rows[r].c[L];return c?c[0]:0;},
  set(m,ref,v,o){o=o||{};const[L,r]=this.ref(ref);const row=this.row(m,r);const c=row.c[L]||(row.c[L]=[0,null,0]);if(o.s!=null)c[0]=o.s;c[1]=(v==null||v==='')?null:v;c[2]=o.f||0;return c;},
  merge(m,rng){if(!m.merges.includes(rng))m.merges.push(rng);},
  // 글 길이에 맞춰 행 높이를 넉넉히 (엑셀 최대 409)
  fitRow(m,r,texts,charsPerLine,minHt){let mx=0;texts.forEach(t=>{if(!t)return;let lines=0;String(t).split('\n').forEach(ln=>{let w=0;for(const ch of ln)w+=ch.charCodeAt(0)>255?2:1;lines+=Math.max(1,Math.ceil(w/charsPerLine));});mx=Math.max(mx,lines);});
    const row=this.row(m,r);const base=Math.max(minHt||0,+row.a.ht||0);const ht=Math.min(409,Math.max(base,mx*12.5+8));if(ht>base){row.a.ht=String(ht);row.a.customHeight='1';}},
  growRows(m,first,last,need){const cap=last-first+1;if(need<=cap)return 0;const d=need-cap;const nr={};
    Object.keys(m.rows).map(Number).sort((a,b)=>b-a).forEach(r=>{nr[r>last?r+d:r]=m.rows[r];});
    const src=m.rows[last]||{a:{},c:{}};for(let r=last+1;r<=last+d;r++){const c={};for(const L in src.c)c[L]=[src.c[L][0],null,0];nr[r]={a:{...src.a},c};}
    m.rows=nr;m.merges=m.merges.map(g=>{const[a,b]=g.split(':');const[la,ra]=this.ref(a);if(ra<=last)return g;const[lb,rb]=this.ref(b||a);return `${la}${ra+d}:${lb}${rb+d}`;});return d;},
  cellXml(L,r,c){const[s,v,f]=c;const a=`r="${L}${r}"${s?` s="${s}"`:''}`;
    if(f)return typeof v==='string'?`<c ${a} t="str"><f>${this.x(f)}</f><v>${this.x(v)}</v></c>`:`<c ${a}><f>${this.x(f)}</f>${v==null?'':`<v>${v}</v>`}</c>`;
    if(v==null)return s?`<c ${a}/>`:'';
    if(typeof v==='number')return `<c ${a}><v>${v}</v></c>`;
    return `<c ${a} t="inlineStr"><is><t xml:space="preserve">${this.x(v)}</t></is></c>`;},
  sheetXml(m){const rows=Object.keys(m.rows).map(Number).sort((a,b)=>a-b).map(r=>{const row=m.rows[r];const at=Object.entries(row.a).map(([k,v])=>` ${k}="${v}"`).join('');
      const cs=Object.keys(row.c).sort((a,b)=>this.N(a)-this.N(b)).map(L=>this.cellXml(L,r,row.c[L])).join('');return `<row r="${r}"${at}>${cs}</row>`;}).join('');
    const cols=m.colGen?`<cols>${m.colGen.map(c=>`<col min="${c[0]}" max="${c[1]}" width="${c[2]}"${c[3]?` style="${c[3]}"`:''}${c[4]?' hidden="1"':''} customWidth="1"/>`).join('')}</cols>`:m.cols;
    const mg=m.merges.length?`<mergeCells count="${m.merges.length}">${m.merges.map(g=>`<mergeCell ref="${g}"/>`).join('')}</mergeCells>`:'';

  crcT:null,crc(u){if(!this.crcT){this.crcT=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;this.crcT[n]=c>>>0;}}let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=this.crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;},
  zip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
    for(const[name,text]of files){const nm=enc.encode(name),data=enc.encode(text),crc=this.crc(data);

      cen.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;}
    const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
    return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});},
  sheetName(n,used){let s=String(n).replace(/[\[\]:*?\/\\]/g,' ').slice(0,31)||'Sheet';let b=s,i=2;while(used.has(s))s=b.slice(0,28)+' '+(i++);used.add(s);return s;},
  book(tpl,sheets){const used=new Set();sheets.forEach(s=>s.name=this.sheetName(s.name,used));const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
    const files=[['[Content_Types].xml',H+`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`],
      ['_rels/.rels',H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],
      ['xl/workbook.xml',H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView xWindow="0" yWindow="0" windowWidth="28800" windowHeight="15000"/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${this.x(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`],
      ['xl/_rels/workbook.xml.rels',H+`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/><Relationship Id="rId${sheets.length+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ['xl/theme/theme1.xml',tpl.theme],['xl/styles.xml',tpl.styles],...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,this.sheetXml(s.model)])];
    return this.zip(files);},
  save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
};

  bojagiWeek(m,days,D,ym,wi){const vs=vendorsOf('bojagi').filter(v=>!v.off).slice(0,14);const Ls=days.map((_,i)=>XW.L(3+i));
